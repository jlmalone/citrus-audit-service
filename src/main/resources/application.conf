ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.citrus.audit.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/citrus_audit"
    url = ${?DB_URL}
    driver = "org.postgresql.Driver"
    user = "citrus"
    user = ${?DB_USER}
    password = "citrus123"
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
}

retention {
    defaultDays = 365
    gdprDays = 2555  # 7 years for GDPR compliance
}
